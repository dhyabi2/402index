name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24, 20]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check branch is rebased on master
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master ${{ github.event.pull_request.head.sha }}; then
            echo "::error::Branch is behind master. Run: git pull --rebase origin master && git push --force-with-lease"
            exit 1
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  mcp-server-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install mcp-server deps
        run: npm ci
        working-directory: mcp-server
      - name: Run mcp-server tests
        run: npm test
        working-directory: mcp-server

  router-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 20]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: router/package-lock.json
      - name: Install router deps
        run: npm ci
        working-directory: router
      - name: Run router tests
        # Stripe-network tests skip themselves when STRIPE_SECRET_KEY is absent
        run: npm test
        working-directory: router
        env:
          ROUTER_STATE_KEY: abababababababababababababababababababababababababababababababab

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run eslint (no-undef gate)
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e handler smoke tests
        run: npm run test:e2e

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerable packages
        run: npm audit --json > audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30
